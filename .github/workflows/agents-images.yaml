# Builds the image of the agent in agents/, smoke-tests it, and publishes it for `agentctl setup`.
name: Agents - build images

on:
  pull_request:
    branches:
      - main
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
      - '!agents/**/*.md'
  push:
    branches:
      - main
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
      - '!agents/**/*.md'

permissions: {}

# A newer push to main must not cancel a run between its build and publish jobs.
concurrency:
  group: agents-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/altinn/altinn-apiclient-maskinporten/agent-minimal

jobs:
  # Each architecture builds on a native runner: under QEMU, the base's containers feature fails its own nft check.
  # The publish job joins the architectures' images into the tags.
  build:
    name: Build agent image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents

      # The containerd image store keeps the image the build step pushes, so the smoke test runs it without a second
      # copy on the runner's disk.
      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull requests build and smoke-test without pushing. The docker driver cannot push by digest, so on main each
      # architecture's image is pushed under its own tag, and the publish job joins them by digest.
      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          set --
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            image="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}-${ARCH}"
            set -- \
              --output "type=image,name=${image},push=true" \
              --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache-${ARCH},mode=max,image-manifest=true"
          else
            image="agent-minimal:smoke"
            set -- --load --tag "${image}"
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache-${ARCH}" \
            "$@" \
            --file agents/Dockerfile \
            --platform "linux/${ARCH}" \
            --target minimal \
            agents
          echo "SMOKE_IMAGE=${image}" >> "${GITHUB_ENV}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
            case "${digest}" in
              sha256:*) ;;
              *) echo "::error::no digest for ${image}: ${digest}"; exit 1 ;;
            esac
            mkdir -p "${RUNNER_TEMP}/digests"
            touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
          fi

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint bash \
            --volume "${PWD}/agents/smoke.sh:/smoke.sh:ro" \
            "${SMOKE_IMAGE}" /smoke.sh

      - name: Upload image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  # Tags the multi-platform image only once both architectures have built and passed the smoke test.
  publish:
    if: github.event_name == 'push'
    name: Publish agent image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag multi-platform image
        run: |
          set -eu
          set -- \
            --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}" \
            --tag "${IMAGE_REPOSITORY}:latest"
          for digest in "${RUNNER_TEMP}"/digests/*; do
            set -- "$@" "${IMAGE_REPOSITORY}@sha256:${digest##*/}"
          done
          docker buildx imagetools create "$@"
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:latest"
